<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculadora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculadora">
    <section class="screen" aria-live="polite">
      <div class="hint" id="hint">&nbsp;</div>
      <div class="main" id="main">0</div>
    </section>

    <section class="keys">
      <button class="k fn" data-k="AC">AC</button>
      <button class="k fn" data-k="(">(</button>
      <button class="k fn" data-k=")">)</button>
      <button class="k op" data-k="÷">÷</button>

      <button class="k" data-k="7">7</button>
      <button class="k" data-k="8">8</button>
      <button class="k" data-k="9">9</button>
      <button class="k op" data-k="×">×</button>

      <button class="k" data-k="4">4</button>
      <button class="k" data-k="5">5</button>
      <button class="k" data-k="6">6</button>
      <button class="k op" data-k="−">−</button>

      <button class="k" data-k="1">1</button>
      <button class="k" data-k="2">2</button>
      <button class="k" data-k="3">3</button>
      <button class="k op" data-k="+">+</button>

      <button class="k" data-k="0">0</button>
      <button class="k" data-k=".">.</button>
      <button class="k fn" data-k="!">x!</button>
      <button class="k fn" data-k="⌫" aria-label="Apagar">⌫</button>

      <button class="k fn" data-k="%">%</button>
      <button class="k eq" data-k="=">=</button>
    </section>
  </main>

  <div class="overlay" id="overlay" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="msg">
    <video id="photo" src="VID-20260923-WA0128.mp4" muted loop playsinline preload="auto"></video>
    <p id="msg">huaushuhash, o gostoso do arthur passou aqui bb, bjo</p>
    <button class="close" id="close">Fechar</button>
  </div>
</div>

  <audio id="song" src="senhoras e senhores.mp3" preload="auto"></audio>
  <script src="script.js"></script>
</body>
</html>
